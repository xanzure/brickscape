[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brickscape"
version = "0.1.0"
description = "MCP server for designing LEGO builds that can actually be built: terrain generators, strict connection and collision checks, renders, part lists and instructions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10", "ldraw-mcp>=0.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
brickscape = "brickscape.__main__:main"
brickscape-mcp = "brickscape.server:main"

[tool.setuptools.packages.find]
where = ["src"]
