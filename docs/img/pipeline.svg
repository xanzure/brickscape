    <text x="765" y="120" text-anchor="middle" fill="#333">PDF instructions</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)">
    <line x1="130" y1="70" x2="168" y2="70"/><line x1="300" y1="70" x2="338" y2="70"/>
    <line x1="470" y1="70" x2="508" y2="70"/><line x1="640" y1="70" x2="678" y2="70"/>
  </g>
  <text x="430" y="135" text-anchor="middle" fill="#888">report back to the client: what was removed, recoloured, or still fails</text>
